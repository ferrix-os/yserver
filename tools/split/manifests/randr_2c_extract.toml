# Phase 2c: one fn per RANDR minor, still in randr_ext.rs (the move into
# randr_ext/{screen,output,crtc,provider,monitor,xinerama} is the next
# commit). Verified by `split verify --extract`.
source = "crates/yserver-core/src/core_loop/process_request.rs"
module = "core_loop::process_request"
file = "crates/yserver-core/src/core_loop/process_request/randr_ext.rs"

[extract]
fn = "handle_randr_request"
scrutinee = "minor"
locals = { byte_order = "ClientByteOrder", minor = "u8" }
keep = [
  "x11randr::RR_SET_SCREEN_CONFIG",
  "1|3",
  "other if other>=RANDR_REQUEST_COUNT",
  "other",
]

[extract.arms]
"x11randr::RR_QUERY_VERSION" = "handle_randr_query_version"
"x11randr::RR_GET_SCREEN_SIZE_RANGE" = "handle_randr_get_screen_size_range"
"x11randr::RR_GET_SCREEN_RESOURCES" = "handle_randr_get_screen_resources"
"x11randr::RR_GET_SCREEN_RESOURCES_CURRENT" = "handle_randr_get_screen_resources_current"
"x11randr::RR_GET_OUTPUT_INFO" = "handle_randr_get_output_info"
"x11randr::RR_GET_CRTC_INFO" = "handle_randr_get_crtc_info"
"x11randr::RR_SET_CRTC_TRANSFORM" = "handle_randr_set_crtc_transform"
"x11randr::RR_GET_CRTC_TRANSFORM" = "handle_randr_get_crtc_transform"
"x11randr::RR_LIST_OUTPUT_PROPERTIES" = "handle_randr_list_output_properties"
"x11randr::RR_QUERY_OUTPUT_PROPERTY" = "handle_randr_query_output_property"
"x11randr::RR_CONFIGURE_OUTPUT_PROPERTY" = "handle_randr_configure_output_property"
"x11randr::RR_CHANGE_OUTPUT_PROPERTY" = "handle_randr_change_output_property"
"x11randr::RR_DELETE_OUTPUT_PROPERTY" = "handle_randr_delete_output_property"
"x11randr::RR_GET_PANNING" = "handle_randr_get_panning"
"x11randr::RR_SET_PANNING" = "handle_randr_set_panning"
"x11randr::RR_SET_OUTPUT_PRIMARY" = "handle_randr_set_output_primary"
"x11randr::RR_GET_OUTPUT_PRIMARY" = "handle_randr_get_output_primary"
"x11randr::RR_GET_PROVIDERS" = "handle_randr_get_providers"
"x11randr::RR_GET_PROVIDER_INFO" = "handle_randr_get_provider_info"
"x11randr::RR_SET_PROVIDER_OFFLOAD_SINK" = "handle_randr_set_provider_offload_sink"
"x11randr::RR_SET_PROVIDER_OUTPUT_SOURCE" = "handle_randr_set_provider_output_source"
"x11randr::RR_GET_MONITORS" = "handle_randr_get_monitors"
"x11randr::RR_SET_MONITOR" = "handle_randr_set_monitor"
"x11randr::RR_DELETE_MONITOR" = "handle_randr_delete_monitor"
"x11randr::RR_GET_CRTC_GAMMA_SIZE" = "handle_randr_get_crtc_gamma_size"
"x11randr::RR_GET_CRTC_GAMMA" = "handle_randr_get_crtc_gamma"
"x11randr::RR_SET_CRTC_GAMMA" = "handle_randr_set_crtc_gamma"
"x11randr::RR_GET_OUTPUT_PROPERTY" = "handle_randr_get_output_property"
"x11randr::RR_SELECT_INPUT" = "handle_randr_select_input"
"x11randr::RR_GET_SCREEN_INFO" = "handle_randr_get_screen_info"
"x11randr::RR_SET_SCREEN_SIZE" = "handle_randr_set_screen_size"
"x11randr::RR_SET_CRTC_CONFIG" = "handle_randr_set_crtc_config"
"16|45" = "handle_randr_create_mode_or_lease"
"x11randr::RR_LIST_PROVIDER_PROPERTIES|x11randr::RR_QUERY_PROVIDER_PROPERTY|x11randr::RR_CONFIGURE_PROVIDER_PROPERTY|x11randr::RR_CHANGE_PROVIDER_PROPERTY|x11randr::RR_DELETE_PROVIDER_PROPERTY|x11randr::RR_GET_PROVIDER_PROPERTY" = "handle_randr_provider_property"
"46" = "handle_randr_free_lease"
