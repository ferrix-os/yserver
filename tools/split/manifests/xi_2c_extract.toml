# Phase 2c: one fn per XI minor, still in xi/dispatch.rs (the move into
# xi/dispatch/{devices,control,events,grabs,props,focus} is the next
# commit). Verified by `split verify --extract`.
source = "crates/yserver-core/src/core_loop/process_request.rs"
module = "core_loop::process_request"
file = "crates/yserver-core/src/core_loop/process_request/xi/dispatch.rs"

[extract]
fn = "handle_xi2_request"
scrutinee = "minor"
locals = { byte_order = "ClientByteOrder", minor = "u8" }
prelude = "buf"
tail = "xi_write_reply"
keep = ["41", "43", "49", "_"]

[extract.arms]
"1" = "handle_xi1_get_extension_version"
"2" = "handle_xi1_list_input_devices"
