# moves from kms/randr.rs to kms/crtc_config.rs, next to its helpers. Names
# unchanged.
source = "crates/yserver/src/kms/render/backend.rs"
module = "kms::render::backend"
dir = "crates/yserver/src/kms/render/backend"
root_form = "file"
table = "backend_crtc_config_move.paths"
modules = []

[locations]
"kms::randr::impl KmsBackend::fn backend_randr_apply_crtc_config" = "calls a #[track_caller] scene damage-audit helper (wake_for_damage) whose recorded caller file:line moves with the body (backend/kms/randr.rs → backend/kms/crtc_config.rs); only diagnostic source attribution changes (scene.rs overflow report and audit attribution), not damage computation"
