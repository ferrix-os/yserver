# Phase 2c move for randr_ext.rs: the per-minor fns of the extract commit
# and the helpers only one group uses go to randr_ext/{screen,output,crtc,
# provider,monitor,xinerama} (descendants of
# core_loop::process_request::randr_ext, so log targets keep the old
# prefix). randr_ext.rs keeps the types, the shared helpers
# (active_monitors, send_root_config_notify, the unsupported-request warn
# pair, request_xid, RANDR_MAJOR_OPCODE, the x11randr import),
# handle_randr_request and the CreateMode/CreateLease and FreeLease stubs.
# Root globs: `pub(crate) use crtc::*` keeps complete_crtc_config (run.rs)
# reachable as process_request::complete_crtc_config; `pub(super) use
# xinerama::*` keeps handle_xinerama_request reachable from the
# process_request dispatch (its visibility goes from pub(super) in
# randr_ext to pub(in crate::core_loop::process_request) in xinerama: same
# reach). Every other moved fn that another module calls becomes
# pub(super) (the old private reach).
source = "crates/yserver-core/src/core_loop/process_request/randr_ext.rs"
module = "core_loop::process_request::randr_ext"
dir = "crates/yserver-core/src/core_loop/process_request/randr_ext"
root_form = "file"
table = "randr_2c_move.paths"

[exceptions]
"fn handle_xinerama_request" = "require_len! is defined and used only inside this fn; its transcriber names fn locals (body, state, client_id, sequence, minor), the fn-local const XINERAMA_MAJOR_OPCODE and fn-local import error, and emit_x11_error_with_minor (process_request root, reached through the use super::* chain): same items at the new call site"

